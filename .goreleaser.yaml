version: 2

project_name: go-agy-acp-wrapper

before:
  hooks:
    - go mod tidy

builds:
  - id: go-agy-acp-wrapper
    main: ./cmd/go-agy-acp-wrapper
    binary: go-agy-acp-wrapper
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{.Version}}

archives:
  - id: binaries
    ids:
      - go-agy-acp-wrapper
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  draft: false
  prerelease: auto
  mode: replace
