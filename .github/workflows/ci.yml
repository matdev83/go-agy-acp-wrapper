name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check repository file manifest
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$BASE_SHA..HEAD"
          elif [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            range="$BEFORE_SHA..HEAD"
          else
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            range="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD)..HEAD"
          fi

          while read -r commit; do
            bash scripts/check-release-clean.sh --ref "$commit"
          done < <(git rev-list --reverse "$range")

          # Also covers branch creations or PRs with an empty calculated range.
          bash scripts/check-release-clean.sh --ref HEAD

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/go-agy-acp-wrapper
